<!DOCTYPE html>
<html>
<head>
<title>Statistiques</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color:#007BFF; color:white; font-family:Roboto, sans-serif; padding:50px; }
h1 { margin-bottom:30px; }
.card { background: rgba(255,255,255,0.15); padding:20px; border-radius:15px; }
</style>
</head>
<body>
<h1>📊 Statistiques</h1>
<div class="card">
    <p>Total emails : {{ total_emails }}</p>
    <p>Total employés : {{ total_employees }}</p>
    <p>Top expéditeurs :</p>
    <ul>
        {% for sender in top_senders %}
            <li>{{ sender.from_employee__email }} : {{ sender.total }}</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
