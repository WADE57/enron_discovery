<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enron Discovery{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fc;
            color: #333;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            padding: 0.8rem 2rem;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
            font-weight: 600;
        }
        .footer {
            background-color: #fff;
            padding: 1.5rem 0;
            margin-top: 3rem;
            border-top: 1px solid #dee2e6;
            text-align: center;
            color: #6c757d;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'enron:home' %}">
                <i class="bi bi-envelope-paper-fill"></i> Enron Discovery
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'enron:search_emails' %}"><i class="bi bi-search"></i> Recherche</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'enron:dashboard' %}"><i class="bi bi-bar-chart-line"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'enron:influence_graph' %}"><i class="bi bi-graph-up-arrow"></i> Influence</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'enron:email_list' %}"><i class="bi bi-envelope"></i> Tous les emails</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">© 2026 Enron Discovery — Projet pédagogique sur le dataset Enron.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
