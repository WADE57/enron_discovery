<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Graphe d'influence</title>
</head>

<body>
    <h1>Graphe d'influence</h1>

    <p>
        <a href="/dashboard/">Dashboard</a> |
        <a href="/search/">Recherche</a>
    </p>

    <form method="get" action="">
        <label>Utilisateur (optionnel):
            <input type="text" name="user" value="{{ user_email }}" placeholder="ex: kay.mann@enron.com" />
        </label>
        <button type="submit">Filtrer</button>
    </form>

    <p>Top connexions expediteur -> destinataire (champ To)</p>

    <table border="1" cellpadding="6" cellspacing="0">
        <tr>
            <th>Expediteur</th>
            <th>Destinataire</th>
            <th>Frequence</th>
        </tr>
        {% for row in connections %}
        <tr>
            <td>{{ row.from_employee__email }}</td>
            <td>{{ row.to_employees__email }}</td>
            <td>{{ row.total }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Aucune connexion trouvee</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
